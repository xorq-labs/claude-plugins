name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic skill suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync env (locked)
        run: uv sync --locked --group test

      - name: Run deterministic suite (no LLM)
        run: uv run pytest tests/ -q -n auto

  llm-e2e:
    name: LLM e2e
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: bigger-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync env (locked)
        run: uv sync --locked --group test

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Seeded from tests/data/*.csv via tests/postgres-init.sql, so the POSTGRES
      # prompt actually runs (it skips otherwise). The fixture data is committed under
      # tests/data/ (tracked), so it's present on the runner.
      - name: Start Postgres (seeded)
        run: docker compose up -d --wait

      - name: Run LLM e2e suite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin the e2e model (conftest reads this -> `claude --model`); Opus for correctness,
          # its extra latency covered by the thread-cap fix + 900s timeout margin.
          XORQ_CLAUDE_PLUGIN_TEST_MODEL: opus
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: xorq
          POSTGRES_USER: xorq
          POSTGRES_PASSWORD: xorq
          # Cap native thread pools so concurrent agent subtrees can't oversubscribe / deadlock.
          # Each `claude -p` spawns xorq (tokio runtime, honors TOKIO_WORKER_THREADS) + sklearn
          # (fork-unsafe OpenBLAS pthreads); under -n parallelism every pool would otherwise size
          # to core count, N times over. These reach every xorq subprocess via the inherited env.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          TOKIO_WORKER_THREADS: "2"
          RAYON_NUM_THREADS: "2"
        # Bounded parallelism (not -n auto): fewer concurrent native-thread-heavy agent
        # subtrees, the other half of the oversubscription fix. Suite has ample headroom
        # under the 30-min job ceiling.
        run: uv run pytest -m llm -q -n 4
